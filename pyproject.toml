[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resumeforge-local"
version = "0.4.2"
description = "Local resume tailoring with measured, fixed-geometry PDF output"
requires-python = ">=3.10"
dependencies = ["reportlab>=4.2,<5", "pdfplumber>=0.11,<1", "pypdf>=5,<7", "pydantic>=2.10,<3", "python-docx>=1.1,<2"]

[project.optional-dependencies]
desktop = ["PySide6-Essentials==6.11.3", "pypdfium2>=4.30", "Pillow>=10"]

[project.gui-scripts]
ResumeForgeDesktop = "resumeforge.desktop:main"

[project.scripts]
resumeforge = "resumeforge.cli:main"

[tool.setuptools.package-data]
resumeforge = ["static/*", "fonts/*", "data/*"]

[tool.setuptools.packages.find]
include = ["resumeforge*"]
