name: Intel macOS desktop download

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/macos-intel.yml'
      - 'tools/macos/**'
      - 'resumeforge/**'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: write

# Multiple small patch commits should not tie up scarce Intel Mac runners.
# Keep the latest push and PR checks while cancelling obsolete revisions.
concurrency:
  group: mac-intel-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  mac-intel:
    name: Build and smoke-test native Intel macOS app
    runs-on: macos-15-intel
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64

      - name: Assert native Intel runner
        run: |
          test "$(uname -m)" = "x86_64"
          python -c "import platform; assert platform.machine() == 'x86_64'"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[desktop]' 'pyinstaller>=6.10,<7'

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v

      - name: Ensure a matched OpenSSL 3 runtime for the Mac bundle
        run: |
          if ! brew list --versions openssl@3 | grep -q .; then
            brew install openssl@3
          fi

      - name: Build Mac app, ZIP and DMG
        run: |
          python tools/macos/build.py --work "$RUNNER_TEMP/resumeforge-mac-work" --out "$RUNNER_TEMP/resumeforge-mac-dist"

      - name: Smoke-test packaged native application
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          "$RUNNER_TEMP/resumeforge-mac-dist/ResumeForge.app/Contents/MacOS/ResumeForge" --package-smoke-test
          "$RUNNER_TEMP/resumeforge-mac-dist/ResumeForge.app/Contents/MacOS/ResumeForge" --full-launch-smoke-test -psn_0_12345
          grep -q "Regular launch probe passed" "$HOME/Library/Logs/ResumeForge/startup.log"
          lipo -archs "$RUNNER_TEMP/resumeforge-mac-dist/ResumeForge.app/Contents/MacOS/ResumeForge" | grep -qx x86_64
          test -s "$RUNNER_TEMP/resumeforge-mac-dist/ResumeForge-macOS-Intel.zip"
          # Verify the downloadable ZIP, even if macOS CI cannot create a DMG.
          mkdir -p "$RUNNER_TEMP/resumeforge-zip-check"
          ditto -x -k "$RUNNER_TEMP/resumeforge-mac-dist/ResumeForge-macOS-Intel.zip" "$RUNNER_TEMP/resumeforge-zip-check"
          test -x "$RUNNER_TEMP/resumeforge-zip-check/ResumeForge.app/Contents/MacOS/ResumeForge"
          "$RUNNER_TEMP/resumeforge-zip-check/ResumeForge.app/Contents/MacOS/ResumeForge" --package-smoke-test

      - name: Test real macOS Cocoa window launch
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          app = Path(os.environ["RUNNER_TEMP"]) / "resumeforge-mac-dist/ResumeForge.app/Contents/MacOS/ResumeForge"
          environment = os.environ.copy()
          environment.pop("QT_QPA_PLATFORM", None)
          result = subprocess.run(
              [str(app), "--full-launch-smoke-test", "-psn_0_12345"],
              env=environment, text=True, capture_output=True, timeout=35)
          print(result.stdout)
          print(result.stderr)
          if result.returncode:
              log = Path.home() / "Library/Logs/ResumeForge/startup.log"
              if log.is_file():
                  print(log.read_text(encoding="utf-8")[-5000:])
              raise SystemExit(f"Native Cocoa startup failed: {result.returncode}")
          PY

      - name: Upload ZIP and DMG
        uses: actions/upload-artifact@v4
        with:
          name: ResumeForge-macOS-Intel
          path: |
            ${{ runner.temp }}/resumeforge-mac-dist/ResumeForge-macOS-Intel.zip
            ${{ runner.temp }}/resumeforge-mac-dist/ResumeForge-macOS-Intel.dmg
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish tested Intel Mac preview download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="mac-intel-${GITHUB_SHA:0:8}"
          assets=("$RUNNER_TEMP/resumeforge-mac-dist/ResumeForge-macOS-Intel.zip")
          if test -s "$RUNNER_TEMP/resumeforge-mac-dist/ResumeForge-macOS-Intel.dmg"; then
            assets+=("$RUNNER_TEMP/resumeforge-mac-dist/ResumeForge-macOS-Intel.dmg")
          fi
          gh release create "$tag" "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "ResumeForge for Intel Mac (preview ${GITHUB_SHA:0:8})" \
            --notes-file tools/macos/RELEASE-NOTES.md \
            --prerelease
